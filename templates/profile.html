<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MailMatrix - Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>MailMatrix</h2>
            <a href="/home"><i class="fas fa-home"></i> Home</a>
            <a href="/profile"><i class="fas fa-user"></i> Profile</a>
            <a href="/history"><i class="fas fa-history"></i> History</a>
            <a href="/contact"><i class="fas fa-envelope"></i> Contact Us</a>
            <a href="/logout" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>


        <div class="main-content">
            <h2 class="welcome-heading">Profile Details</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="/profile">
                <label>First Name:</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" readonly>

                <label>Last Name:</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" readonly>

                <label>Email ID:</label>
                <input type="email" name="email" value="{{ user.email }}" readonly>

                <label>Organization / Company:</label>
                <input type="text" name="organization" value="{{ user.organization }}">

                <label>Phone Number:</label>
                <input type="text" name="mobile" value="{{ user.mobile }}">

                <label>New Password:</label>
                <input type="password" name="new_password" placeholder="Leave blank to keep existing">

                <button type="submit" class="update-button">Update Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
